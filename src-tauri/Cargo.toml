[package]
name = "qradha"
version = "0.1.0"
description = "Quantum Resilient Adaptive Dynamic Hamburg Engine"
authors = ["Qradha Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15"
once_cell = "1.19"
