<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1929"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  
  <!-- Q letter stylized as quantum port -->
  <circle cx="512" cy="480" r="280" fill="none" stroke="url(#accent)" stroke-width="60"/>
  
  <!-- Q tail (representing data flow) -->
  <path d="M 650 600 L 850 800" stroke="#FF6B35" stroke-width="60" stroke-linecap="round"/>
  
  <!-- Inner quantum dots -->
  <circle cx="400" cy="400" r="40" fill="#00D9FF"/>
  <circle cx="620" cy="400" r="40" fill="#00D9FF"/>
  <circle cx="512" cy="560" r="40" fill="#FF6B35"/>
  
  <!-- Connection lines (tensor network) -->
  <line x1="400" y1="400" x2="620" y2="400" stroke="#00D9FF" stroke-width="8" opacity="0.5"/>
  <line x1="400" y1="400" x2="512" y2="560" stroke="#00D9FF" stroke-width="8" opacity="0.5"/>
  <line x1="620" y1="400" x2="512" y2="560" stroke="#00D9FF" stroke-width="8" opacity="0.5"/>
</svg>
